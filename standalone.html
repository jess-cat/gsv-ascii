document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"17af4336-aaab-4835-a4c3-307a320e74cf\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<style>\n  *{ box-sizing:border-box; }\n  html,body{ margin:0; background:#0a0713; }\n  input[type=range]{ -webkit-appearance:none; appearance:none; height:3px; background:rgba(150,134,240,.22); border-radius:2px; outline:none; }\n  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#cbc7ff; cursor:pointer; box-shadow:0 0 8px rgba(140,120,235,.7); }\n  textarea::placeholder{ color:rgba(196,188,255,.25); }\n  textarea:focus{ outline:none; border-color:rgba(150,134,240,.5) !important; }\n<\u002Fstyle>\n<script src=\"17daeb5f-249c-4d64-a751-21f38a7898c8\"><\u002Fscript>\n<\u002Fhelmet>\n<div style=\"{{ pageStyle }}\">\n\n  <!-- ===== controls ===== -->\n  <div style=\"{{ panelStyle }}\">\n    <div>\n      <div style=\"{{ h1Style }}\">ASCII&nbsp;ANIMATOR<\u002Fdiv>\n      <div style=\"{{ subStyle }}\">GSV ASSEMBLE ENGINE · PASTE ANY ASCII<\u002Fdiv>\n      <a href=\"https://ascii-art-generator.org\" target=\"_blank\" rel=\"noopener\" style=\"{{ genLinkStyle }}\">↗ TURN AN IMAGE INTO ASCII<\u002Fa>\n    <\u002Fdiv>\n\n    <div style=\"{{ fieldStyle }}\">\n      <div style=\"{{ labelStyle }}\">SOURCE ASCII<\u002Fdiv>\n      <textarea ref=\"{{ taRef }}\" oninput=\"{{ onAscii }}\" defaultvalue=\"{{ defaultAscii }}\" spellcheck=\"false\" placeholder=\"paste ascii art here…\" style=\"{{ taStyle }}\"><\u002Ftextarea>\n    <\u002Fdiv>\n\n    <div style=\"{{ fieldStyle }}\">\n      <div style=\"{{ rowStyle }}\"><span style=\"{{ labelStyle }}\">FONT SIZE<\u002Fspan><span style=\"{{ valStyle }}\">{{ fontSizeLabel }}<\u002Fspan><\u002Fdiv>\n      <input type=\"range\" min=\"1\" max=\"30\" step=\"1\" value=\"{{ fontSize }}\" oninput=\"{{ onFontSize }}\" style=\"width:100%;\">\n    <\u002Fdiv>\n\n    <div style=\"{{ fieldStyle }}\">\n      <div style=\"{{ labelStyle }}\">DIRECTION<\u002Fdiv>\n      <div style=\"{{ segWrapStyle }}\">\n        <sc-for list=\"{{ winds }}\" as=\"w\" hint-placeholder-count=\"5\">\n          <button onclick=\"{{ w.onClick }}\" style=\"{{ w.style }}\">{{ w.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"{{ fieldStyle }}\">\n      <div style=\"{{ rowStyle }}\"><span style=\"{{ labelStyle }}\">ASSEMBLE TIME<\u002Fspan><span style=\"{{ valStyle }}\">{{ speedLabel }}<\u002Fspan><\u002Fdiv>\n      <input type=\"range\" min=\"0.4\" max=\"4\" step=\"0.1\" value=\"{{ assembleSeconds }}\" oninput=\"{{ onSpeed }}\" style=\"width:100%;\">\n    <\u002Fdiv>\n\n    <div style=\"{{ fieldStyle }}\">\n      <div style=\"{{ labelStyle }}\">ACCENT<\u002Fdiv>\n      <div style=\"{{ swatchWrapStyle }}\">\n        <sc-for list=\"{{ colors }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <button onclick=\"{{ c.onClick }}\" title=\"{{ c.val }}\" style=\"{{ c.style }}\"><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"{{ rowStyle }}\">\n      <button onclick=\"{{ onStarfield }}\" style=\"{{ starfieldStyle }}\">STARFIELD<\u002Fbutton>\n      <button onclick=\"{{ onGlow }}\" style=\"{{ glowBtnStyle }}\">GLOW<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- ===== GIF export ===== -->\n    <div style=\"{{ gifBoxStyle }}\">\n      <div style=\"{{ labelStyle }}\">EXPORT GIF · RASTER<\u002Fdiv>\n      <div style=\"{{ fieldStyle }}\">\n        <div style=\"{{ rowStyle }}\"><span style=\"{{ miniLabelStyle }}\">FPS<\u002Fspan><span style=\"{{ valStyle }}\">{{ fpsLabel }}<\u002Fspan><\u002Fdiv>\n        <input type=\"range\" min=\"8\" max=\"24\" step=\"1\" value=\"{{ fps }}\" oninput=\"{{ onFps }}\" style=\"width:100%;\">\n      <\u002Fdiv>\n      <div style=\"{{ fieldStyle }}\">\n        <div style=\"{{ rowStyle }}\"><span style=\"{{ miniLabelStyle }}\">MAX WIDTH<\u002Fspan><span style=\"{{ valStyle }}\">{{ maxWidthLabel }}<\u002Fspan><\u002Fdiv>\n        <input type=\"range\" min=\"240\" max=\"900\" step=\"20\" value=\"{{ maxWidth }}\" oninput=\"{{ onMaxWidth }}\" style=\"width:100%;\">\n      <\u002Fdiv>\n      <div style=\"{{ estStyle }}\">{{ estLabel }}<\u002Fdiv>\n      <button onclick=\"{{ onExport }}\" style=\"{{ exportBtnStyle }}\">{{ exportLabel }}<\u002Fbutton>\n      <sc-if value=\"{{ exporting }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ progTrackStyle }}\"><div style=\"{{ progFillStyle }}\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasGif }}\" hint-placeholder-val=\"{{ false }}\">\n        <a href=\"{{ gifUrl }}\" download=\"gsv-ascii.gif\" style=\"{{ dlStyle }}\">↓ DOWNLOAD · {{ gifSizeLabel }}<\u002Fa>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ===== preview ===== -->\n  <div style=\"{{ previewStyle }}\">\n    <div style=\"{{ stageFrameStyle }}\">\n      <div ref=\"{{ stageRef }}\"><\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ onReplay }}\" style=\"{{ replayStyle }}\">↻ REPLAY<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  DEFAULT_ART = [\n\"        .  *        .            *      .       \",\n\"   *        .---.        .              .    *   \",\n\"      .    /     \\\\   .        *      .           \",\n\"          |  o o  |          ___                  \",\n\"     *    |   ^   |     .   /   \\\\      .     *    \",\n\"      .    \\\\ '-' /    .    | === |   .            \",\n\"           '---'           \\\\___/        *         \",\n\"   .    *        .   _________________    .       \",\n\"        .            \\\\===============/       *    \",\n\"   *        .    .    \\\\=== G S V ===/   .         \",\n\"      .              . \\\\===========/      .   *   \",\n\"        *      .       '~~~~~~~~~~~'    .          \",\n\"   .       *        .         .      *       .    \"\n  ].join(\"\\n\");\n\n  state = {\n    ascii: this.DEFAULT_ART,\n    fontSize: 16,\n    wind: 'right',\n    assembleSeconds: 1.7,\n    accentColor: '#8071dd',\n    starfield: true,\n    glow: true,\n    fps: 16,\n    maxWidth: 520,\n    exporting: false,\n    progress: 0,\n    gifUrl: null,\n    gifSize: 0\n  };\n\n  COLORS = ['#8071dd','#71b8dd','#71dd9e','#ddc471','#dd71a6','#c9c4e0'];\n  WINDLIST = [['right','RIGHT'],['left','LEFT'],['up','UP'],['down','DOWN'],['scatter','BURST']];\n\n  componentDidMount(){\n    if (window.GSVAscii) GSVAscii.ensureFont();\n    (document.fonts ? document.fonts.ready : Promise.resolve()).then(()=>{ this._ready=true; this.remount(); });\n  }\n  componentWillUnmount(){ if(this._anim) this._anim.destroy(); if(this._gifUrl) URL.revokeObjectURL(this._gifUrl); }\n\n  opts(){\n    return {\n      accentColor: this.state.accentColor,\n      background: '#100b1e',\n      fontSize: this.state.fontSize,\n      wind: this.state.wind,\n      assembleSeconds: this.state.assembleSeconds,\n      holdSeconds: 1.8,\n      loop: true,\n      starfield: this.state.starfield,\n      glow: this.state.glow\n    };\n  }\n\n  remount(){\n    if(!this._ready || !window.GSVAscii) return;\n    const el = this._stageRef && this._stageRef.current;\n    if(!el) return;\n    if(this._anim) this._anim.destroy();\n    this._anim = GSVAscii.mount(el, this.state.ascii || ' ', this.opts());\n  }\n\n  set(patch){ this.setState(patch, ()=>this.remount()); }\n\n  onAscii = (e)=>{ this.set({ ascii: e.target.value }); };\n  onFontSize = (e)=>{ this.set({ fontSize: +e.target.value }); };\n  onSpeed = (e)=>{ this.set({ assembleSeconds: +e.target.value }); };\n  setWind = (w)=>()=>this.set({ wind: w });\n  setColor = (c)=>()=>this.set({ accentColor: c });\n  onStarfield = ()=>this.set({ starfield: !this.state.starfield });\n  onGlow = ()=>this.set({ glow: !this.state.glow });\n  onReplay = ()=>{ if(this._anim) this._anim.replay(); };\n  onFps = (e)=>this.setState({ fps: +e.target.value });\n  onMaxWidth = (e)=>this.setState({ maxWidth: +e.target.value });\n\n  onExport = async ()=>{\n    if(this.state.exporting || !window.GSVAscii) return;\n    if(this._gifUrl){ URL.revokeObjectURL(this._gifUrl); this._gifUrl=null; }\n    this.setState({ exporting:true, progress:0, gifUrl:null, gifSize:0 });\n    try{\n      const blob = await GSVAscii.exportGIF(this.state.ascii || ' ', this.opts(), {\n        fps: this.state.fps, maxWidth: this.state.maxWidth,\n        onProgress: (p)=>this.setState({ progress:p })\n      });\n      this._gifUrl = URL.createObjectURL(blob);\n      this.setState({ exporting:false, gifUrl:this._gifUrl, gifSize:blob.size });\n    }catch(err){ console.error('GIF export failed', err); this.setState({ exporting:false }); }\n  };\n\n  estimate(){\n    let pw=1, ph=1;\n    try{ const g = GSVAscii.parse(this.state.ascii||' '); pw=g.pw; ph=g.ph; }catch(e){}\n    let fs = this.state.fontSize, cw=0.6;\n    if(pw*fs*cw > this.state.maxWidth) fs = this.state.maxWidth/(pw*cw);\n    const W = Math.ceil(pw*fs*cw), H = Math.ceil(ph*fs);\n    const frames = Math.round((this.state.assembleSeconds + 1.2) * this.state.fps);\n    return { W, H, frames };\n  }\n\n  fmtSize(b){ return b<1024 ? b+' B' : b<1048576 ? (b/1024).toFixed(0)+' KB' : (b/1048576).toFixed(2)+' MB'; }\n\n  renderVals(){\n    this._stageRef ||= React.createRef();\n    this._taRef ||= React.createRef();\n    const mono=\"'Departure Mono', ui-monospace, monospace\";\n    const s=this.state, accent=s.accentColor;\n    const est=this.estimate();\n\n    const pageStyle=`display:flex; min-height:100vh; background:#0a0713; font-family:${mono}; color:#e9e4ff;`;\n    const panelStyle=`flex:0 0 340px; display:flex; flex-direction:column; gap:18px; padding:30px 26px; background:#0d0a18; border-right:1px solid rgba(150,134,240,.14); overflow-y:auto; max-height:100vh;`;\n    const h1Style=`font-size:22px; letter-spacing:.16em; color:#e9e4ff;`;\n    const subStyle=`font-size:10px; letter-spacing:.26em; color:rgba(196,188,255,.34); margin-top:6px;`;\n    const genLinkStyle=`display:inline-block; margin-top:11px; padding:6px 11px; background:rgba(128,113,221,.12); border:1px solid rgba(150,134,240,.28); border-radius:2px; color:rgba(203,199,255,.9); font-family:${mono}; font-size:9px; letter-spacing:.16em; text-decoration:none;`;\n    const fieldStyle=`display:flex; flex-direction:column; gap:9px;`;\n    const rowStyle=`display:flex; align-items:center; justify-content:space-between; gap:12px;`;\n    const labelStyle=`font-size:10px; letter-spacing:.24em; color:rgba(196,188,255,.56); text-transform:uppercase;`;\n    const miniLabelStyle=`font-size:10px; letter-spacing:.18em; color:rgba(196,188,255,.44); text-transform:uppercase;`;\n    const valStyle=`font-size:11px; letter-spacing:.10em; color:${accent};`;\n    const taStyle=`width:100%; height:120px; resize:vertical; padding:11px 12px; background:#07060f; color:#b9b2e6; border:1px solid rgba(150,134,240,.20); border-radius:3px; font-family:${mono}; font-size:11px; line-height:1.35; white-space:pre; overflow:auto;`;\n\n    const segWrapStyle=`display:flex; gap:6px; flex-wrap:wrap;`;\n    const seg=(active)=>`flex:1 1 auto; min-width:52px; padding:7px 6px; background:${active?'rgba(128,113,221,.20)':'rgba(20,16,40,.5)'}; border:1px solid ${active?'rgba(180,168,255,.6)':'rgba(150,134,240,.18)'}; border-radius:2px; color:${active?'#f4f2ff':'rgba(196,188,255,.6)'}; font-family:${mono}; font-size:10px; letter-spacing:.14em; cursor:pointer;`;\n    const winds=this.WINDLIST.map(([val,label])=>({ label, onClick:this.setWind(val), style:seg(s.wind===val) }));\n\n    const swatchWrapStyle=`display:flex; gap:9px;`;\n    const colors=this.COLORS.map(c=>({ val:c, onClick:this.setColor(c),\n      style:`width:30px; height:30px; border-radius:50%; background:${c}; cursor:pointer; border:2px solid ${s.accentColor===c?'#f4f2ff':'transparent'}; box-shadow:${s.accentColor===c?`0 0 10px ${c}`:'none'}; padding:0;` }));\n\n    const toggle=(on)=>`flex:1; padding:9px; background:${on?'rgba(128,113,221,.18)':'rgba(20,16,40,.5)'}; border:1px solid ${on?'rgba(180,168,255,.55)':'rgba(150,134,240,.18)'}; border-radius:2px; color:${on?'#f4f2ff':'rgba(196,188,255,.5)'}; font-family:${mono}; font-size:10px; letter-spacing:.18em; cursor:pointer;`;\n\n    const gifBoxStyle=`display:flex; flex-direction:column; gap:12px; margin-top:6px; padding:18px 16px; background:#07060f; border:1px solid rgba(150,134,240,.16); border-radius:3px;`;\n    const estStyle=`font-size:10px; letter-spacing:.12em; color:rgba(196,188,255,.40); line-height:1.5;`;\n    const exportBtnStyle=`padding:11px; background:${s.exporting?'rgba(20,16,40,.6)':accent}; border:1px solid ${s.exporting?'rgba(150,134,240,.3)':accent}; border-radius:2px; color:${s.exporting?'rgba(196,188,255,.6)':'#0a0713'}; font-family:${mono}; font-size:11px; letter-spacing:.2em; cursor:${s.exporting?'default':'pointer'}; font-weight:bold;`;\n    const progTrackStyle=`height:4px; background:rgba(150,134,240,.18); border-radius:2px; overflow:hidden;`;\n    const progFillStyle=`height:100%; width:${Math.round(s.progress*100)}%; background:${accent}; box-shadow:0 0 8px ${accent}; transition:width .1s linear;`;\n    const dlStyle=`display:block; text-align:center; padding:10px; background:rgba(128,113,221,.14); border:1px solid rgba(180,168,255,.5); border-radius:2px; color:#f4f2ff; font-family:${mono}; font-size:11px; letter-spacing:.14em; text-decoration:none;`;\n\n    const previewStyle=`flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; padding:40px; background:radial-gradient(ellipse 80% 80% at 50% 45%, #100b1e 0%, #0a0713 80%);`;\n    const stageFrameStyle=`padding:28px 32px; background:#100b1e; border:1px solid rgba(150,134,240,.14); border-radius:4px; box-shadow:0 1px 0 rgba(150,134,240,.05) inset, 0 18px 60px rgba(0,0,0,.4); max-width:100%; overflow:auto;`;\n    const replayStyle=`display:flex; align-items:center; gap:8px; padding:9px 18px; background:rgba(20,16,40,.55); border:1px solid rgba(140,120,235,.45); border-radius:2px; color:#cbc7ff; font-family:${mono}; font-size:11px; letter-spacing:.2em; cursor:pointer;`;\n\n    return {\n      pageStyle, panelStyle, h1Style, subStyle, genLinkStyle, fieldStyle, rowStyle, labelStyle, miniLabelStyle, valStyle, taStyle,\n      segWrapStyle, swatchWrapStyle, gifBoxStyle, estStyle, exportBtnStyle, progTrackStyle, progFillStyle, dlStyle,\n      previewStyle, stageFrameStyle, replayStyle,\n      taRef:this._taRef, stageRef:this._stageRef, defaultAscii:this.DEFAULT_ART,\n      onAscii:this.onAscii, onFontSize:this.onFontSize, onSpeed:this.onSpeed,\n      onStarfield:this.onStarfield, onGlow:this.onGlow, onReplay:this.onReplay,\n      onFps:this.onFps, onMaxWidth:this.onMaxWidth, onExport:this.onExport,\n      winds, colors,\n      starfieldStyle:toggle(s.starfield), glowBtnStyle:toggle(s.glow),\n      fontSize:s.fontSize, fontSizeLabel:s.fontSize+'px',\n      assembleSeconds:s.assembleSeconds, speedLabel:s.assembleSeconds.toFixed(1)+'s',\n      fps:s.fps, fpsLabel:s.fps+' fps',\n      maxWidth:s.maxWidth, maxWidthLabel:s.maxWidth+'px',\n      estLabel:`${est.W}×${est.H}px · ${est.frames} frames`,\n      exporting:s.exporting, exportLabel:s.exporting?`ENCODING ${Math.round(s.progress*100)}%`:'EXPORT GIF',\n      hasGif: !!s.gifUrl, gifUrl:s.gifUrl||'#', gifSizeLabel:this.fmtSize(s.gifSize)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
